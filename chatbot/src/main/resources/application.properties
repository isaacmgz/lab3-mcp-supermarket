spring.application.name=supermarket-chatbot
server.port=${SERVER_PORT:8080}

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash}
spring.ai.google.genai.chat.options.temperature=0.2

spring.ai.mcp.client.name=supermarket-chatbot
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.supermarket.url=${MCP_SERVER_URL:http://localhost:8088}
spring.ai.mcp.client.streamable-http.connections.supermarket.endpoint=/mcp

chatbot.memory.max-messages=40

logging.level.com.udea.chatbot=INFO
