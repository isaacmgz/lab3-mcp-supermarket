spring.application.name=supermarket-mcp-server
server.port=${SERVER_PORT:8088}

spring.ai.mcp.server.name=supermarket-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.instructions=Tools to browse a supermarket catalog, manage customers and place home-delivery orders. Prices are in Colombian pesos (COP).
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/supermarket}
spring.datasource.username=${DB_USER:supermarket}
spring.datasource.password=${DB_PASSWORD:supermarket}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

logging.level.org.springframework.ai=INFO
logging.level.io.modelcontextprotocol=INFO
