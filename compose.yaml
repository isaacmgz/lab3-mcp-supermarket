services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: supermarket-db
    environment:
      POSTGRES_DB: supermarket
      POSTGRES_USER: supermarket
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supermarket}
    ports:
      - "5433:5432"
    volumes:
      - supermarket-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermarket -d supermarket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  supermarket-data:
